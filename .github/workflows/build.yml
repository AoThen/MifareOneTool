name: Build Release

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
    - uses: actions/checkout@v4

    - name: Setup MSBuild
      uses: microsoft/setup-msbuild@v1.3

    - name: Setup NuGet
      uses: NuGet/setup-nuget@v1

    - name: Restore NuGet Packages
      run: nuget restore MifareOneTool.sln

    - name: Build Release
      run: msbuild MifareOneTool.sln -t:rebuild -property:Configuration=Release -property:Platform=x86

    - name: Create Release Package
      run: |
        $binDir = "MifareOneTool\bin\Release"
        $zipName = "MifareOneTool_${{ github.ref_name }}.zip"
        if (-not (Test-Path $binDir)) {
          Write-Error "Release directory not found!"
          exit 1
        }
        Compress-Archive -Path "$binDir\*" -DestinationPath $zipName
        echo "ZIP_NAME=$zipName" >> $env:GITHUB_ENV

    # - name: Upload to GitHub Release
    #   if: startsWith(github.ref, 'refs/tags/')
    #   uses: softprops/action-gh-release@v1
    #   with:
    #     files: ${{ env.ZIP_NAME }}
    #     draft: true
    #     generate_release_notes: true
    #   env:
    #     GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    - name: Upload Artifact (manual run)
      if: "!startsWith(github.ref, 'refs/tags/')"
      uses: actions/upload-artifact@v6
      with:
        name: MifareOneTool-Build
        path: ${{ env.ZIP_NAME }}
