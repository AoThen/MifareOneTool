name: Build Release

on:
  push:
  workflow_dispatch:

env:
  LIBNFC_VERSION: "libnfc-1.8.0"
  MFOC_VERSION: "0.10.7"
  MFCUK_VERSION: "0.3.8"

jobs:
  build:
    runs-on: windows-latest

    steps:
    - uses: actions/checkout@v4

    - name: Setup MSBuild
      uses: microsoft/setup-msbuild@v1.3

    - name: Setup NuGet
      uses: NuGet/setup-nuget@v1

    - name: Restore NuGet Packages
      run: nuget restore MifareOneTool.sln

    # ============================================================
    # 从源码编译 NFC 工具 (使用 MINGW64 因为 MINGW32 缺少关键包)
    # ============================================================
    - name: Setup MSYS2
      uses: msys2/setup-msys2@v2
      with:
        msystem: MINGW64
        update: true
        install: >-
          mingw-w64-x86_64-toolchain
          mingw-w64-x86_64-cmake
          mingw-w64-x86_64-ninja
          mingw-w64-x86_64-libusb
          mingw-w64-x86_64-libusb-compat
          git
          make
          autoconf
          automake
          libtool
          pkg-config

    - name: Build libnfc from source
      shell: msys2 {0}
      run: |
        set -e
        echo "=== Building libnfc from source ==="
        
        # 克隆 libnfc
        git clone --depth 1 https://github.com/nfc-tools/libnfc.git
        cd libnfc
        
        # 修复 contrib/win32/stdlib.c 中的 bug: char *str[32] 应为 char str[32]
        sed -i 's/char \*str\[32\]/char str[256]/g' contrib/win32/stdlib.c
        
        # 创建构建目录
        mkdir -p build && cd build
        
        # 设置 PKG_CONFIG_PATH 以找到 libusb
        export PKG_CONFIG_PATH="/mingw64/lib/pkgconfig:$PKG_CONFIG_PATH"
        
        # 验证 libusb 已安装
        pkg-config --cflags --libs libusb-1.0 || echo "Warning: pkg-config check failed"
        
        # CMake 配置和构建 (MinGW64)
        # 禁用需要 libusb 0.1 的 USB 驱动，保留 PN532 UART 驱动
        # 注意：变量名必须是 LIBNFC_DRIVER_* 而不是 DRIVER_*
        # 禁用 ENVVARS 避免编译有 bug 的 stdlib.c (char *str[32] 应为 char str[32])
        # 禁用 EXAMPLES 因为部分依赖 USB 驱动的内部函数
        cmake -G "Ninja" \
          -DCMAKE_BUILD_TYPE=Release \
          -DCMAKE_INSTALL_PREFIX=/mingw64 \
          -DCMAKE_PREFIX_PATH=/mingw64 \
          -DLIBUSB_INCLUDE_DIRS=/mingw64/include/libusb-1.0 \
          -DLIBUSB_LIBRARIES=/mingw64/lib/libusb-1.0.dll.a \
          -DCMAKE_POLICY_VERSION_MINIMUM=3.5 \
          -DLIBNFC_DRIVER_ACR122_USB=OFF \
          -DLIBNFC_DRIVER_PN53X_USB=OFF \
          -DLIBNFC_DRIVER_ARYGON=OFF \
          -DLIBNFC_DRIVER_ACR122S=OFF \
          -DLIBNFC_ENVVARS=OFF \
          -DBUILD_EXAMPLES=OFF \
          ..
        
        ninja
        ninja install
        
        echo "=== libnfc built successfully ==="
        
        # 创建 libnfc.pc 文件供 pkg-config 使用
        # CMake 的 Windows 构建不生成 .pc 文件
        printf 'prefix=/mingw64\nexec_prefix=${prefix}\nlibdir=${exec_prefix}/lib\nincludedir=${prefix}/include\n\nName: libnfc\nDescription: NFC library\nVersion: 1.8.0\nLibs: -L${libdir} -lnfc\nCflags: -I${includedir}\n' > /mingw64/lib/pkgconfig/libnfc.pc
        
        echo "=== Created libnfc.pc ==="
        pkg-config --cflags --libs libnfc
        
        # 列出生成的工具
        ls -la utils/ 2>/dev/null || ls -la .

    - name: Build mfoc from source
      shell: msys2 {0}
      run: |
        set -e
        echo "=== Building mfoc from source ==="
        
        # 设置 PKG_CONFIG_PATH 以找到 libnfc
        export PKG_CONFIG_PATH="/mingw64/lib/pkgconfig:$PKG_CONFIG_PATH"
        
        # 创建 err.h 兼容头文件 (MinGW 没有 BSD err.h)
        mkdir -p /mingw64/include
        printf '%s\n' '#ifndef _ERR_H' '#define _ERR_H' '#include <stdio.h>' '#include <stdlib.h>' '#include <stdarg.h>' '#include <string.h>' '#include <errno.h>' 'static inline void err(int eval, const char *fmt, ...) { va_list ap; va_start(ap, fmt); fprintf(stderr, "error: "); vfprintf(stderr, fmt, ap); fprintf(stderr, ": %%s\\n", strerror(errno)); va_end(ap); exit(eval); }' 'static inline void errx(int eval, const char *fmt, ...) { va_list ap; va_start(ap, fmt); fprintf(stderr, "error: "); vfprintf(stderr, fmt, ap); fprintf(stderr, "\\n"); va_end(ap); exit(eval); }' 'static inline void warn(const char *fmt, ...) { va_list ap; va_start(ap, fmt); fprintf(stderr, "warning: "); vfprintf(stderr, fmt, ap); fprintf(stderr, ": %%s\\n", strerror(errno)); va_end(ap); }' 'static inline void warnx(const char *fmt, ...) { va_list ap; va_start(ap, fmt); fprintf(stderr, "warning: "); vfprintf(stderr, fmt, ap); fprintf(stderr, "\\n"); va_end(ap); }' '#endif' > /mingw64/include/err.h
        
        # 克隆 mfoc
        git clone --depth 1 https://github.com/nfc-tools/mfoc.git
        cd mfoc
        
        # 修补: errno 作为参数名与系统宏冲突
        sed -i 's/int errno/int err_code/g' src/mfoc.h src/mfoc.c
        
        # Autoreconf
        autoreconf -vis
        
        # 配置和构建
        ./configure --prefix=/mingw64 --libdir=/mingw64/lib
        make -j$(nproc)
        make install
        
        echo "=== mfoc built successfully ==="

    - name: Build mfcuk from source
      shell: msys2 {0}
      run: |
        set -e
        echo "=== Building mfcuk from source ==="
        
        # 设置 PKG_CONFIG_PATH 以找到 libnfc
        export PKG_CONFIG_PATH="/mingw64/lib/pkgconfig:$PKG_CONFIG_PATH"
        
        # 创建 endian.h 兼容头文件 (MinGW 没有)
        printf '%s\n' '#ifndef _ENDIAN_H' '#define _ENDIAN_H' '#include <stdint.h>' '#include <winsock2.h>' '#include <sys/param.h>' '#define htole16(x) (x)' '#define le16toh(x) (x)' '#define htole32(x) (x)' '#define le32toh(x) (x)' '#define htobe16(x) htons(x)' '#define be16toh(x) ntohs(x)' '#define htobe32(x) htonl(x)' '#define be32toh(x) ntohl(x)' '#endif' > /mingw64/include/endian.h
        
        # 克隆 mfcuk
        git clone --depth 1 https://github.com/nfc-tools/mfcuk.git
        cd mfcuk
        
        # Autoreconf
        autoreconf -vis
        
        # 配置和构建
        ./configure --prefix=/mingw64 --libdir=/mingw64/lib
        make -j$(nproc)
        make install
        
        echo "=== mfcuk built successfully ==="

    - name: Build mfoc-hardnested from source
      shell: msys2 {0}
      run: |
        set -e
        echo "=== Building mfoc-hardnested from source ==="
        
        # 设置 PKG_CONFIG_PATH 以找到 libnfc
        export PKG_CONFIG_PATH="/mingw64/lib/pkgconfig:$PKG_CONFIG_PATH"
        
        # 克隆 mfoc-hardnested
        git clone --depth 1 https://github.com/nfc-tools/mfoc-hardnested.git
        cd mfoc-hardnested
        
        # Autoreconf
        autoreconf -vis
        
        # 配置和构建
        ./configure --prefix=/mingw64 --libdir=/mingw64/lib
        make -j$(nproc)
        
        echo "=== mfoc-hardnested built successfully ==="

    - name: Collect built tools
      shell: msys2 {0}
      run: |
        set -e
        echo "=== Collecting all built tools ==="
        
        # 创建 nfc-bin 目录
        mkdir -p nfc-bin
        
        # 复制 libnfc 工具
        cp -v libnfc/build/utils/*.exe nfc-bin/ 2>/dev/null || true
        cp -v libnfc/build/examples/*.exe nfc-bin/ 2>/dev/null || true
        
        # 复制 mfoc
        cp -v mfoc/src/mfoc.exe nfc-bin/ 2>/dev/null || true
        
        # 复制 mfcuk
        cp -v mfcuk/src/mfcuk.exe nfc-bin/ 2>/dev/null || true
        
        # 复制 mfoc-hardnested
        cp -v mfoc-hardnested/src/mfoc.exe nfc-bin/mfoc-hardnested.exe 2>/dev/null || true
        
        # 复制必要的 DLL
        cp -v /mingw64/bin/libnfc.dll nfc-bin/ 2>/dev/null || true
        cp -v /mingw64/bin/libusb-1.0.dll nfc-bin/ 2>/dev/null || true
        cp -v /mingw64/bin/libgcc_s_seh-1.dll nfc-bin/ 2>/dev/null || true
        cp -v /mingw64/bin/libwinpthread-1.dll nfc-bin/ 2>/dev/null || true
        cp -v /mingw64/bin/libstdc++-6.dll nfc-bin/ 2>/dev/null || true
        
        # 创建 mfdetect（使用 mfoc 的检测功能）
        cp nfc-bin/mfoc.exe nfc-bin/mfdetect.exe 2>/dev/null || true
        
        # 创建 collect.exe 占位（hardnested nonce 收集功能由 mfoc-hardnested 提供）
        cp nfc-bin/mfoc-hardnested.exe nfc-bin/collect.exe 2>/dev/null || true
        
        echo "=== Tools collected ==="
        ls -la nfc-bin/

    - name: Prepare nfc-bin for Windows
      run: |
        Write-Host "Preparing nfc-bin directory..."
        
        # 确保目录存在
        if (Test-Path "nfc-bin") {
          Write-Host "Contents of nfc-bin:"
          Get-ChildItem -Path "nfc-bin" -Name
          
          # 检查必要文件
          $requiredFiles = @(
            "nfc-list.exe",
            "nfc-mfclassic.exe", 
            "mfoc.exe"
          )
          
          foreach ($file in $requiredFiles) {
            if (Test-Path "nfc-bin\$file") {
              Write-Host "[OK] $file"
            } else {
              Write-Warning "[MISSING] $file"
            }
          }
        } else {
          Write-Error "nfc-bin directory not found!"
          exit 1
        }

    # ============================================================
    # 构建 .NET 项目
    # ============================================================
    - name: Build .NET Release
      run: msbuild MifareOneTool.sln -t:rebuild -property:Configuration=Release -property:Platform=x86

    # ============================================================
    # 创建发布包
    # ============================================================
    - name: Create Release Package
      run: |
        $binDir = "MifareOneTool\bin\Release"
        $zipName = "MifareOneTool_${{ github.ref_name }}.zip"
        
        if (-not (Test-Path $binDir)) {
          Write-Error "Release directory not found!"
          exit 1
        }
        
        # 复制 nfc-bin 到输出目录
        if (Test-Path "nfc-bin") {
          Write-Host "Copying nfc-bin to release directory..."
          Copy-Item -Path "nfc-bin" -Destination "$binDir\nfc-bin" -Recurse -Force
          Write-Host "nfc-bin copied successfully"
        } else {
          Write-Warning "nfc-bin directory not found!"
        }
        
        # 创建 auto_keys 目录
        New-Item -ItemType Directory -Path "$binDir\auto_keys" -Force | Out-Null
        
        # 列出最终打包内容
        Write-Host "=== Release package contents ==="
        Get-ChildItem -Path $binDir -Recurse -Name | Select-Object -First 100
        
        Compress-Archive -Path "$binDir\*" -DestinationPath $zipName
        echo "ZIP_NAME=$zipName" >> $env:GITHUB_ENV

    # - name: Upload to GitHub Release
    #   if: startsWith(github.ref, 'refs/tags/')
    #   uses: softprops/action-gh-release@v1
    #   with:
    #     files: ${{ env.ZIP_NAME }}
    #     draft: true
    #     generate_release_notes: true
    #   env:
    #     GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    - name: Upload Artifact (manual run)
      if: "!startsWith(github.ref, 'refs/tags/')"
      uses: actions/upload-artifact@v6
      with:
        name: MifareOneTool-Build
        path: ${{ env.ZIP_NAME }}
